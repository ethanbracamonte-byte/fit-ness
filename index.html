<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weekly Strength & PRT Checklist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #020617;
      --card: #020617;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --text: #e5e7eb;
      --muted: #6b7280;
      --danger: #f97373;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1f2937 0, #020617 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 12px;
    }

    .app {
      max-width: 800px;
      margin: 0 auto;
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.98));
      border-radius: 24px;
      padding: 16px;
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(148, 163, 184, 0.08);
    }

    header {
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      padding-bottom: 8px;
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .title {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    button, select, input, textarea {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(17, 24, 39, 0.9);
      color: var(--text);
      padding: 6px 10px;
      font-size: 0.8rem;
      outline: none;
    }

    button {
      cursor: pointer;
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.25), rgba(15, 23, 42, 0.98));
      border: 1px solid rgba(148, 163, 184, 0.5);
      transition: transform 0.07s ease, box-shadow 0.07s ease, border-color 0.07s ease;
      white-space: nowrap;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.4), 0 10px 20px rgba(15, 23, 42, 0.9);
      border-color: rgba(56, 189, 248, 0.7);
    }

    button.small {
      padding: 4px 8px;
      font-size: 0.75rem;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: radial-gradient(circle at top, rgba(30, 64, 175, 0.5), rgba(15, 23, 42, 0.98));
      border-radius: var(--radius);
      padding: 12px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      box-shadow:
        0 12px 28px rgba(15, 23, 42, 0.75),
        0 0 0 1px rgba(15, 23, 42, 0.65);
    }

    .card h2 {
      font-size: 0.95rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tag {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.45);
      color: var(--muted);
    }

    .day-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 90px;
    }

    .field label {
      font-size: 0.75rem;
      color: var(--muted);
    }

    input[type="number"], input[type="text"], textarea {
      width: 100%;
      border-radius: 10px;
      padding: 6px 9px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      font-size: 0.8rem;
    }

    textarea {
      min-height: 60px;
      border-radius: 14px;
      resize: vertical;
    }

    .pill-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      font-size: 0.75rem;
      cursor: pointer;
    }

    .pill-toggle input {
      width: 14px;
      height: 14px;
      accent-color: var(--accent);
    }

    .checklist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 6px;
      max-height: 230px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.97);
      border: 1px solid rgba(148, 163, 184, 0.35);
      font-size: 0.8rem;
    }

    .check-item input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: var(--accent);
    }

    .check-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .check-text.done {
      text-decoration: line-through;
      color: var(--muted);
    }

    .delete-btn {
      border-radius: 999px;
      padding: 2px 6px;
      font-size: 0.7rem;
      background: rgba(248, 113, 113, 0.1);
      border-color: rgba(248, 113, 113, 0.6);
      color: #fecaca;
    }

    .hint {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <div class="title">Strength & PRT Weekly Checklist</div>
        <div class="subtitle">Each day auto-loads your workout as a checklist you can tap off</div>
      </div>
      <div class="right">
        <button class="small" id="prevDayBtn">&#x276E;</button>
        <div id="dateDisplay" style="font-size:0.8rem; color:var(--muted);"></div>
        <button class="small" id="nextDayBtn">&#x276F;</button>
      </div>
    </header>

    <main>
      <section class="card">
        <h2>
          Today&#39;s Plan
          <span class="tag" id="planNameTag">Plan: —</span>
        </h2>
        <div class="day-label" id="weekdayLabel"></div>

        <div class="row" style="margin-bottom:4px;">
          <label class="pill-toggle">
            <input type="checkbox" id="restDayToggle" />
            Rest day taken
          </label>
        </div>

        <div class="row">
          <div class="field">
            <label for="distanceInput">Distance (miles)</label>
            <input type="number" step="0.01" id="distanceInput" placeholder="e.g. 1.50" />
          </div>
          <div class="field">
            <label for="timeInput">Time (minutes)</label>
            <input type="number" step="0.1" id="timeInput" placeholder="e.g. 12.5" />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="painInput">Pain (0–10)</label>
            <input type="number" id="painInput" min="0" max="10" step="1" />
          </div>
          <div class="field">
            <label for="waterInput">Water (oz)</label>
            <input type="number" id="waterInput" step="1" />
          </div>
          <div class="field">
            <label for="weightInput">Weight (lb)</label>
            <input type="number" id="weightInput" step="0.1" />
          </div>
        </div>

        <div class="row">
          <div class="field" style="flex:1 1 100%;">
            <label for="notesInput">Notes (what you did, pain, breathing, etc.)</label>
            <textarea id="notesInput"></textarea>
          </div>
        </div>

        <hr style="border:none; border-top:1px solid rgba(148,163,184,0.3); margin:6px 0;" />

        <h2>Checklist <span class="tag">Auto-filled by weekday</span></h2>

        <div class="row">
          <div class="field">
            <label for="newItemInput">Add item</label>
            <div class="row">
              <input type="text" id="newItemInput" placeholder="Add or tweak today’s tasks..." />
              <button class="small" id="addItemBtn">Add</button>
            </div>
          </div>
        </div>

        <ul class="checklist" id="checklist"></ul>

        <div class="hint">
          This should already show items for today (e.g., on Sunday: Rest & Recovery checklist). If it’s empty, something didn’t paste right.
        </div>
      </section>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "weekly_checklist_v1";

    // 0 = Sunday, 1 = Monday, ... 6 = Saturday
    const WEEK_TEMPLATES = {
      0: { // SUNDAY
        name: "Sunday – Rest & Recovery",
        restDay: true,
        items: [
          "Full rest from heavy lifting and hard running",
          "Optional: 10–20 min easy walk",
          "5–10 min light stretching or yoga",
          "Hydration on point (hit water goal)",
          "Check shin pain (0–10) and general soreness",
          "Plan next week’s sessions"
        ]
      },
      1: { // MONDAY
        name: "Monday – Max Strength A (Squat & Bench)",
        restDay: false,
        items: [
          "Warm-up: 5–10 min easy walk/bike",
          "Dynamic warm-up: leg + hip mobility (5 min)",
          "Back Squat – 3×5 heavy (full depth)",
          "Bench Press – 3×5 heavy",
          "Barbell Row – 3×5",
          "Walking Lunges – 3×8 each leg",
          "Plank – 3×30–45 sec",
          "Cool-down walk – 5–10 min",
          "Lower body stretching 5–10 min"
        ]
      },
      2: { // TUESDAY
        name: "Tuesday – Easy Run + Core",
        restDay: false,
        items: [
          "Warm-up: 5–10 min easy walk",
          "Easy run/jog – 15–25 min (comfortable pace)",
          "Cool-down walk – 5–10 min",
          "Core: Plank – 3×30 sec",
          "Core: Dead bug – 3×8 each side",
          "Shin/calf mobility – 5 min",
          "Log shin pain (0–10)"
        ]
      },
      3: { // WEDNESDAY
        name: "Wednesday – Max Strength B (Deadlift & Press)",
        restDay: false,
        items: [
          "Warm-up: 5–10 min easy bike/row",
          "Dynamic warm-up: hips + shoulders (5 min)",
          "Deadlift – 3×5 (reset each rep, tight form)",
          "Overhead Press – 3×5",
          "Pull-ups or Lat Pulldown – 3×8",
          "Romanian Deadlift – 3×8",
          "Hanging Leg Raise or Reverse Crunch – 3×10–15",
          "Cool-down walk – 5–10 min",
          "Hamstring + hip stretch – 5–10 min"
        ]
      },
      4: { // THURSDAY
        name: "Thursday – PRT Run (1.5 Mile Focus)",
        restDay: false,
        items: [
          "Warm-up walk – 5 min",
          "Dynamic warm-up: leg swings, butt kicks, high knees – 5 min",
          "Easy jog – 5–10 min",
          "Main: 1.5 mile run OR 3×800m intervals",
          "4×20–30 sec strides (fast but controlled)",
          "Cool-down walk – 5–10 min",
          "Stretch calves, hamstrings, quads, hips – 5–10 min",
          "Log time and shin pain (0–10)"
        ]
      },
      5: { // FRIDAY
        name: "Friday – Full-Body Strength (Moderate)",
        restDay: false,
        items: [
          "Warm-up: 5–10 min easy cardio",
          "Goblet Squat – 3×8",
          "Incline Dumbbell Bench – 3×8–10",
          "One-arm Dumbbell Row – 3×8 each side",
          "Romanian Deadlift – 3×8",
          "Dumbbell Shoulder Press – 3×8–10",
          "Core: Side plank – 3×20–30 sec each side",
          "Cool-down walk – 5–10 min",
          "Stretch tight areas 5–10 min"
        ]
      },
      6: { // SATURDAY
        name: "Saturday – Easy / Long Run + Mobility",
        restDay: false,
        items: [
          "Warm-up walk – 5–10 min",
          "Easy run/jog or brisk walk – 20–30+ min",
          "Cool-down walk – 5–10 min",
          "Shin + calf mobility – 5–10 min",
          "Foam roll quads, calves, glutes – 5–10 min",
          "Stretch hamstrings, hips, ankles",
          "Log distance, time and pain (0–10)"
        ]
      }
    };

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch {
        return {};
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function formatISO(date) {
      return date.toISOString().slice(0, 10);
    }

    function prettyDate(date) {
      return date.toLocaleDateString(undefined, {
        weekday: "long",
        month: "short",
        day: "numeric",
        year: "numeric"
      });
    }

    let data = loadData();
    let currentDate = new Date();

    // DOM
    const dateDisplay = document.getElementById("dateDisplay");
    const weekdayLabel = document.getElementById("weekdayLabel");
    const planNameTag = document.getElementById("planNameTag");
    const prevDayBtn = document.getElementById("prevDayBtn");
    const nextDayBtn = document.getElementById("nextDayBtn");

    const restDayToggle = document.getElementById("restDayToggle");
    const distanceInput = document.getElementById("distanceInput");
    const timeInput = document.getElementById("timeInput");
    const painInput = document.getElementById("painInput");
    const waterInput = document.getElementById("waterInput");
    const weightInput = document.getElementById("weightInput");
    const notesInput = document.getElementById("notesInput");

    const checklistEl = document.getElementById("checklist");
    const newItemInput = document.getElementById("newItemInput");
    const addItemBtn = document.getElementById("addItemBtn");

    function getEntry(date) {
      const iso = formatISO(date);
      if (!data[iso]) {
        const weekday = date.getDay();
        const template = WEEK_TEMPLATES[weekday];
        data[iso] = {
          restDay: template ? template.restDay : false,
          distance: "",
          time: "",
          pain: "",
          water: "",
          weight: "",
          notes: "",
          planName: template ? template.name : "",
          checklist: template
            ? template.items.map(text => ({ text, done: false }))
            : []
        };
        saveData();
      }
      return data[iso];
    }

    function render() {
      const entry = getEntry(currentDate);
      const iso = formatISO(currentDate);

      dateDisplay.textContent = prettyDate(currentDate);
      const weekday = currentDate.toLocaleDateString(undefined, { weekday: "long" });
      weekdayLabel.textContent = weekday;
      planNameTag.textContent = "Plan: " + (entry.planName || "—");

      restDayToggle.checked = !!entry.restDay;
      distanceInput.value = entry.distance ?? "";
      timeInput.value = entry.time ?? "";
      painInput.value = entry.pain ?? "";
      waterInput.value = entry.water ?? "";
      weightInput.value = entry.weight ?? "";
      notesInput.value = entry.notes ?? "";

      renderChecklist(entry.checklist);
    }

    function renderChecklist(items) {
      checklistEl.innerHTML = "";
      items.forEach((item, index) => {
        const li = document.createElement("li");
        li.className = "check-item";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = !!item.done;
        checkbox.addEventListener("change", () => {
          item.done = checkbox.checked;
          saveData();
          renderChecklist(items);
        });

        const span = document.createElement("span");
        span.className = "check-text" + (item.done ? " done" : "");
        span.textContent = item.text;

        const delBtn = document.createElement("button");
        delBtn.textContent = "X";
        delBtn.className = "small delete-btn";
        delBtn.addEventListener("click", () => {
          items.splice(index, 1);
          saveData();
          renderChecklist(items);
        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(delBtn);
        checklistEl.appendChild(li);
      });

      // If somehow it's empty, show a soft warning
      if (items.length === 0) {
        const li = document.createElement("li");
        li.className = "check-item";
        li.innerHTML = "<span class='check-text'>No tasks for today. If this is Sunday, you should see a Rest & Recovery list here.</span>";
        checklistEl.appendChild(li);
      }
    }

    function changeDay(offset) {
      currentDate.setDate(currentDate.getDate() + offset);
      render();
    }

    // Attach events
    prevDayBtn.addEventListener("click", () => changeDay(-1));
    nextDayBtn.addEventListener("click", () => changeDay(1));

    function attachSaver(inputEl, key) {
      inputEl.addEventListener("change", () => {
        const iso = formatISO(currentDate);
        const entry = getEntry(currentDate);
        entry[key] = inputEl.value;
        saveData();
      });
    }

    attachSaver(distanceInput, "distance");
    attachSaver(timeInput, "time");
    attachSaver(painInput, "pain");
    attachSaver(waterInput, "water");
    attachSaver(weightInput, "weight");
    attachSaver(notesInput, "notes");

    restDayToggle.addEventListener("change", () => {
      const entry = getEntry(currentDate);
      entry.restDay = restDayToggle.checked;
      saveData();
    });

    addItemBtn.addEventListener("click", () => {
      const text = newItemInput.value.trim();
      if (!text) return;
      const entry = getEntry(currentDate);
      entry.checklist.push({ text, done: false });
      newItemInput.value = "";
      saveData();
      renderChecklist(entry.checklist);
    });

    newItemInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        addItemBtn.click();
      }
    });

    // Initial render (today). If today is Sunday, you should see the Sunday Rest checklist.
    render();
  </script>
</body>
</html>
